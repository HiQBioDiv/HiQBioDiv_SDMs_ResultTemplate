name: Bookdown check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown
            any::rmarkdown
            any::knitr
            any::readxl
            any::dplyr

      - name: Check generated Bookdown structure
        shell: Rscript {0}
        run: |
          source("R/create_species_accounts.R")
          sync_species_accounts()

          stopifnot(file.exists("book/_bookdown.yml"))
          stopifnot(dir.exists("book/species"))